name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Pakai Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # Tidak ada dependensi npm: proyek ini sengaja tanpa node_modules.
      - name: Periksa sintaks semua berkas .mjs dan entry Vercel
        run: |
          find . -name node_modules -prune -o \( -name '*.mjs' -o -name '*.js' \) -print0 | xargs -0 -n1 node --check
      - name: Jalankan test
        run: npm test
      - name: Pastikan server dapat dimuat tanpa jaringan
        run: node --input-type=module -e "import('./server.mjs').then(m => { if (typeof m.createServer !== 'function') process.exit(1); });"
